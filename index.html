<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5c3a21">
<link rel="manifest" href="manifest.json">
<title>Álbum de Fotos de família</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
height:100%; overflow:hidden;
font-family: 'Georgia', 'Times New Roman', serif;
background:#2b1810;
background-image:
radial-gradient(circle at 20% 20%, rgba(120,80,40,0.3), transparent 60%),
radial-gradient(circle at 80% 80%, rgba(90,60,30,0.3), transparent 60%);
color:#3a2415;
user-select:none;
}

#book {
position:absolute; inset:0;
display:flex; align-items:center; justify-content:center;
cursor: grab;
touch-action: pan-y;
overflow: hidden;
perspective: 1600px;
}
#book.grabbing { cursor: grabbing; }

/* ============================================================
PÁGINAS
============================================================ */
.page {
position:absolute;
width:min(92vw, 520px);
height:min(80vh, 760px);
background:#f5ecd8;
border-radius:6px;
box-shadow:
0 20px 40px rgba(0,0,0,0.5),
inset 0 0 0 1px rgba(120,80,40,0.2),
inset 0 0 80px rgba(160,120,70,0.25);
background-image:
repeating-linear-gradient(0deg, rgba(160,120,70,0.04) 0 2px, transparent 2px 4px),
radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), transparent 70%);
transform-origin: left center;
backface-visibility: hidden;
overflow:hidden;
display:flex; flex-direction:column;
padding:22px 22px 40px;

will-change: transform;
transform-style: preserve-3d;
transition: transform 560ms cubic-bezier(0.22, 0.61, 0.36, 1);
}

.page.is-active {
transform: rotateY(0deg);
opacity:1;
z-index:3;
}

.page.is-next,
.page.is-prev {
transform: rotateY(0deg);
opacity:1;
z-index:2;
pointer-events:none;
}

/* A página que está sendo virada sai da pilha normal e vira uma
camada isolada, sempre por cima de tudo. Como ela é a ÚNICA
página com transform 3D em cada instante, o navegador nunca
precisa comparar profundidade 3D entre duas páginas rotacionadas
ao mesmo tempo — a origem do bug de "ficar atrás". */
.page.flip-layer {
z-index:999;
pointer-events:none;
}

.page.dragging {
transition: none;
}

.page::after {
content:''; position:absolute; inset:0;
background:linear-gradient(90deg, rgba(90,60,30,0.18), transparent 8%);
pointer-events:none;
border-radius:6px;
}

.page-number {
position:absolute; bottom:12px; left:0; right:0;
text-align:center; font-size:13px; color:#8a6b4a;
font-style:italic; letter-spacing:1px;
}

/* ---- MOLDURA + FOTO ---- */
.photo-frame {
flex: 1;
display: flex;
justify-content: center;
align-items: center;
padding: 10px;
}

.photo {
background: #fff;
padding: 10px 10px 0;
border-radius: 2px;
box-shadow: 0 6px 18px rgba(60, 35, 15, 0.4);
display: flex;
flex-direction: column;
align-items: center;
max-width: 100%;
max-height: 100%;
transform: rotate(var(--rot, 0deg));
}

.photo img {
display: block;
max-width: 100%;
max-height: 55vh;
width: auto;
height: auto;
object-fit: contain;
filter: sepia(0.25) contrast(1.05) saturate(0.9);
background: #111;
transition: transform 0.3s ease;
transform-origin: center;
-webkit-user-drag: none;
user-drag: none;
}

.photo .caption {
font-family: 'Georgia', serif;
font-style: italic;
font-size: 13px;
color: #7a5a3a;
text-align: center;
margin: 10px 0 12px;
max-width: 100%;
white-space: normal;
overflow: hidden;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
padding: 0 6px;
line-height: 1.3;
}

.photo .placeholder {
padding: 40px 30px;
color: #8a6b4a;
font-style: italic;
font-size: 13px;
background: #e8dcc4;
border-radius: 2px;
}

/* ---- CAPA ---- */
.cover {
position: relative;
padding: 0 !important;
border: none;
overflow: hidden;
background: #2a1a0e;
}
.cover-img {
position: absolute;
inset: 0;
background-image: url('fotos/capa.webp');
background-size: cover;
background-repeat: no-repeat;
background-position: center;
background-color: #2a1a0e;
z-index: 1;
}

.cover-img.cover-img-fallback {
background-image: none;
}
.cover-img.cover-img-fallback::before {
content: '📷';
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
font-size: 64px;
opacity: 0.35;
}

/* ---- PÁGINA FINAL ---- */
.end-page {
padding: 22px 22px 40px;
justify-content: center;
align-items: center;
text-align: center;
}
.end-content {
display: flex; flex-direction: column;
align-items: center; justify-content: center;
height: 100%; width: 100%; padding: 20px;
}
.end-ornament { font-size:44px; color:#8a6b4a; opacity:0.75; margin-bottom:22px; }
.end-title {
font-family:'Georgia','Times New Roman',serif;
font-size: clamp(22px, 5vw, 30px);
font-style: italic; font-weight: normal;
letter-spacing: 2px; color:#7a5a3a; margin-bottom: 24px;
}
.end-line { width:80px; height:1px; background:#b89a72; opacity:0.7; margin:0 0 24px 0; }
.end-message {
font-family:'Georgia','Times New Roman',serif;
font-style: italic; font-size:16px; line-height:1.9;
color:#7a5a3a; max-width:300px; margin-bottom:24px;
}
.end-count {
font-family:'Georgia','Times New Roman',serif;
font-style: italic; font-size:13px; color:#8a6b4a;
letter-spacing:1px; margin-bottom:6px;
}
.end-signature {
font-family:'Georgia','Times New Roman',serif;
font-style: italic; font-size:13px; color:#8a6b4a;
letter-spacing:1px; opacity:0.85;
}

/* ---- ZOOM OVERLAY (com transição real de opacity) ---- */
#zoom-overlay {
position: fixed; inset: 0;
background: rgba(20, 10, 5, 0.92);
display: flex;
align-items: center; justify-content: center;
z-index: 500; padding: 20px;
cursor: zoom-out;
opacity: 0;
visibility: hidden;
transition: opacity 0.25s ease, visibility 0s linear 0.25s;
outline: none;
}
#zoom-overlay.visible {
opacity: 1;
visibility: visible;
transition: opacity 0.25s ease, visibility 0s;
}
#zoom-overlay img {
max-width: 95vw;
max-height: 95vh;
object-fit: contain;
box-shadow: 0 10px 40px rgba(0,0,0,0.8);
filter: sepia(0.25) contrast(1.05) saturate(0.9);
-webkit-user-drag: none;
user-drag: none;
}

/* ---- CONTROLES ---- */
.nav {
position:absolute; bottom:0; left:0; right:0;
display:flex; justify-content:space-between;
padding:14px 18px; z-index:100;
}
.nav button {
background:rgba(245,236,216,0.9);
border:none; border-radius:50%;
width:38px; height:38px;
font-size:17px; color:#5c3a21;
box-shadow:0 6px 16px rgba(0,0,0,0.4);
cursor:pointer; transition:transform 0.15s, background 0.2s;
display:flex; align-items:center; justify-content:center;
}
.nav button:active { transform:scale(0.9); background:#e8d9bc; }
.nav button:disabled { opacity:0.3; }
.nav button.restarting { animation: restartPulse 0.22s ease-in-out infinite alternate; }
@keyframes restartPulse { from { transform:scale(0.92); } to { transform:scale(1.05); } }

.hint {
position:absolute; top:14px; left:0; right:0;
text-align:center; color:#d8c0a0; font-size:12px;
font-style:italic; letter-spacing:1px; z-index:100;
text-shadow:0 2px 4px rgba(0,0,0,0.6);
pointer-events:none; transition:opacity 0.6s;
}
.hint.hide { opacity:0; }

#loading {
position:absolute; inset:0; display:flex;
align-items:center; justify-content:center;
color:#e0c8a0; font-style:italic; z-index:200;
background:#2b1810;
}

/* ---- CONTROLE DE MÚSICA ---- */
#music-toggle {
position:absolute; top:12px; right:14px; z-index:100;
background: transparent;
border: none;
border-radius: 0;
width: 40px; height: 40px;
font-size: 20px;
line-height: 1;
color: #ffffff;
box-shadow: none;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
transition: transform 0.15s, opacity 0.2s;
text-shadow: 0 2px 6px rgba(0,0,0,0.7);
-webkit-text-fill-color: #ffffff;
font-family: 'Segoe UI Symbol', 'Apple Symbols', 'Noto Sans Symbols', sans-serif;
}

#music-toggle:active {
transform: scale(0.9);
opacity: 0.8;
background: transparent;
}

#music-toggle.is-pause {
transform: scale(0.65);
}

#music-toggle.is-pause:active {
transform: scale(0.58);
}

@media (max-width:480px) {
.page { width:94vw; height:78vh; padding:16px 16px 36px; }
.photo { padding:8px 8px 0; }
.photo img { max-height: 50vh; }
.photo .caption { font-size:12px; margin:8px 0 10px; }
.end-ornament { font-size: 36px; margin-bottom: 18px; }
.end-message { font-size: 15px; }
.end-title { font-size: 22px; }
}

@media (max-height: 480px) and (orientation: landscape) {
.page { height: 92vh; padding: 10px 16px 30px; }
.photo img { max-height: 60vh; }
.photo .caption { margin: 4px 0 6px; font-size: 11px; }
.end-message { font-size: 13px; margin-bottom: 12px; }
.end-ornament { font-size: 28px; margin-bottom: 10px; }
}

@media (prefers-reduced-motion: reduce) {
.page { transition-duration: 1ms !important; }
#zoom-overlay { transition-duration: 1ms !important; }
}
</style>
</head>
<body>

<div id="loading">Abrindo o álbum…</div>

<div id="book"></div>

<button id="music-toggle" aria-label="Ligar/desligar música" aria-pressed="false">▶&#xFE0E;</button>

<audio id="bgm" src="fotos/familia.mp3" preload="auto"></audio>

<div class="hint" id="hint">Deslize ou toque nas setas para folhear</div>

<div class="nav">
<button id="prev" aria-label="Página anterior">‹</button>
<button id="restart" aria-label="Recomeçar álbum" title="Recomeçar álbum">↩</button>
<button id="next" aria-label="Próxima página">›</button>
</div>

<div id="zoom-overlay" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1">
<img alt="">
</div>

<script>
const PHOTOS_DIR = 'fotos/';
const MANIFEST_URL = PHOTOS_DIR + 'manifest.json';

const book = document.getElementById('book');
const loading = document.getElementById('loading');
const hint = document.getElementById('hint');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const restartBtn = document.getElementById('restart');
const zoomOverlay = document.getElementById('zoom-overlay');
const zoomImg = zoomOverlay.querySelector('img');

let photos = [];
let pages = [];
let current = 0;
let animating = false;

/* ============================================================
MÚSICA DE FUNDO
============================================================ */
const bgm = document.getElementById('bgm');
const musicToggle = document.getElementById('music-toggle');
const MUSIC_KEY = 'album-familia-musica-mutada';

bgm.volume = 0.7;
bgm.loop = true;

// Estado desejado pelo usuário (persistido)
let userWantsMusic = localStorage.getItem(MUSIC_KEY) !== '1';

function updateMusicIcon() {
// Ícone reflete o estado REAL do áudio, não a intenção
const playing = !bgm.paused && !bgm.ended;
// ▶ = tocando | ⏸ = pausado
musicToggle.textContent = playing ? '\u2759\u2759' : '\u25B6\uFE0E';
musicToggle.classList.toggle('is-pause', playing);
musicToggle.setAttribute('aria-pressed', playing ? 'true' : 'false');
}

// Sincroniza ícone com eventos reais do áudio
bgm.addEventListener('play',  updateMusicIcon);
bgm.addEventListener('pause', updateMusicIcon);
bgm.addEventListener('ended', updateMusicIcon);

async function tryPlayMusic() {
if (!userWantsMusic) { updateMusicIcon(); return; }
try {
await bgm.play();
updateMusicIcon();
} catch (_) {
// Bloqueado: aguarda primeira interação real do usuário
updateMusicIcon(); // mostra 🔇 até conseguir tocar
}
}

// Qualquer interação real (exceto o próprio botão) libera o áudio
function unlockOnInteraction(e) {
if (e && e.target && e.target.closest && e.target.closest('#music-toggle')) return;
if (!userWantsMusic) return;
bgm.play().then(() => {
updateMusicIcon();
document.removeEventListener('pointerdown', unlockOnInteraction);
}).catch(() => {});
}
document.addEventListener('pointerdown', unlockOnInteraction);

// Botão: alterna o ESTADO DESEJADO e aplica imediatamente
musicToggle.addEventListener('click', async (e) => {
e.stopPropagation(); // não deixa o unlock handler atrapalhar

userWantsMusic = !userWantsMusic;
localStorage.setItem(MUSIC_KEY, userWantsMusic ? '0' : '1');

if (userWantsMusic) {
try { await bgm.play(); } catch (_) {}
} else {
bgm.pause();
}
updateMusicIcon();
});

updateMusicIcon();
tryPlayMusic();

/* ============================================================
ZOOM OVERLAY
============================================================ */
function openZoom(src, alt) {
if (zoomOverlay.classList.contains('visible')) return;
zoomImg.src = src;
zoomImg.alt = alt || '';
zoomOverlay.classList.add('visible');
zoomOverlay.setAttribute('aria-hidden', 'false');
zoomOverlay.focus();
}
function closeZoom() {
if (!zoomOverlay.classList.contains('visible')) return;
zoomOverlay.classList.remove('visible');
zoomOverlay.setAttribute('aria-hidden', 'true');
zoomImg.src = '';
}
zoomOverlay.addEventListener('click', closeZoom);
document.addEventListener('keydown', e => {
if (e.key === 'Escape') closeZoom();
});

/* ============================================================
DESCOBERTA
============================================================ */
async function discoverPhotos() {
console.log('🔍 Procurando fotos...');

try {
const url = MANIFEST_URL + '?t=' + Date.now();
const r = await fetch(url);
if (r.ok) {
const list = await r.json();
const normalized = normalizeList(list);
if (normalized.length) return normalized;
}
} catch(e) { console.error('Erro manifest:', e); }

try {
const r = await fetch('fotos.json?t=' + Date.now());
if (r.ok) {
const list = await r.json();
const normalized = normalizeList(list);
if (normalized.length) return normalized;
}
} catch(e) {}

try {
const host = location.hostname;
const parts = location.pathname.split('/').filter(Boolean);
const repo = parts[0];
if (host.endsWith('github.io') && repo) {
const user = host.split('.')[0];
const api = `https://api.github.com/repos/${user}/${repo}/contents/fotos`;
const r = await fetch(api);
if (r.ok) {
const data = await r.json();
const files = data
.filter(f => f.type === 'file' && /\.(jpe?g|png|gif|webp|bmp)$/i.test(f.name))
.map(f => f.name)
.sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));
if (files.length) return normalizeList(files);
}
}
} catch(e) { console.error('Erro API:', e); }

return [];
}

function normalizeList(list) {
if (!Array.isArray(list)) return [];
const seen = new Set();
const out = [];
for (const item of list) {
let file, caption;
if (typeof item === 'string') {
file = item;
caption = item.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
} else if (item && item.file) {
file = item.file;
caption = item.caption || item.file.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
} else {
continue;
}
if (!/\.(jpe?g|png|webp|gif|bmp)$/i.test(file)) continue;
if (/^capa\.(jpe?g|png|webp|gif|bmp)$/i.test(file)) continue;
if (seen.has(file)) continue;
seen.add(file);
out.push({ file, caption });
}
return out;
}

function buildPages(fileList) {
const pgs = [{ type:'cover' }];
for (let i = 0; i < fileList.length; i++) {
pgs.push({ type:'photo', items:[fileList[i]] });
}
if (fileList.length > 0) pgs.push({ type:'end' });
return pgs;
}

/* ============================================================
RENDER
============================================================ */
function renderPage(page, index) {
const el = document.createElement('div');
el.className = 'page';
el.dataset.index = index;

if (page.type === 'cover') {
el.classList.add('cover');
el.innerHTML = `<div class="cover-img"></div>`;
const testImg = new Image();
testImg.onerror = () => {
const coverEl = el.querySelector('.cover-img');
if (coverEl) coverEl.classList.add('cover-img-fallback');
};
testImg.src = PHOTOS_DIR + 'capa.webp';
} else if (page.type === 'end') {
el.classList.add('end-page');
el.innerHTML = `
<div class="end-content">
<div class="end-ornament">❦</div>
<h1 class="end-title">Continua…</h1>
<div class="end-line"></div>
<p class="end-message">
O tempo passa,<br>
as fotos ficam,<br>
e o amor permanece.
</p>
<div class="end-line"></div>
<p class="end-signature">Nossa família</p>
</div>
`;
} else {
const frame = document.createElement('div');
frame.className = 'photo-frame';

page.items.forEach((item) => {
const wrap = document.createElement('div');
wrap.className = 'photo';

const seed = (item.file.length * (index + 1)) % 3;
wrap.style.setProperty('--rot', (seed - 1) * 0.8 + 'deg');

const img = document.createElement('img');
img.src = PHOTOS_DIR + encodeURIComponent(item.file);
img.alt = item.caption;
img.loading = 'lazy';
img.decoding = 'async';
img.draggable = false;

img.onerror = () => {
img.onerror = null;
img.style.display = 'none';
const ph = document.createElement('div');
ph.className = 'placeholder';
ph.textContent = '📷 foto indisponível';
wrap.insertBefore(ph, img);
};

let downX = 0, downY = 0;
let lastTap = 0;
img.addEventListener('pointerdown', e => {
downX = e.clientX;
downY = e.clientY;
});
img.addEventListener('pointerup', e => {
if (Math.hypot(e.clientX - downX, e.clientY - downY) > 10) return;
const now = Date.now();
if (now - lastTap < 350) {
openZoom(img.src, img.alt);
}
lastTap = now;
});

const cap = document.createElement('div');
cap.className = 'caption';
cap.textContent = item.caption;

wrap.appendChild(img);
wrap.appendChild(cap);
frame.appendChild(wrap);
});

el.appendChild(frame);

const pn = document.createElement('div');
pn.className = 'page-number';
pn.textContent = `— ${index} —`;
el.appendChild(pn);
}
return el;
}

/* ============================================================
PRELOAD
============================================================ */
const preloadCache = new Set();
function preloadPage(index) {
const p = pages[index];
if (!p) return;
if (p.type === 'photo') {
p.items.forEach(item => {
if (preloadCache.has(item.file)) return;
preloadCache.add(item.file);
const img = new Image();
img.src = PHOTOS_DIR + encodeURIComponent(item.file);
});
}
}
function preloadAround() {
preloadPage(current + 1);
preloadPage(current + 2);
preloadPage(current - 1);
}

/* ============================================================
JANELA DE 3 PÁGINAS
============================================================ */
function mountWindow() {
book.innerHTML = '';
const order = [current - 1, current, current + 1];
order.forEach(i => {
if (i < 0 || i >= pages.length) return;
const el = renderPage(pages[i], i);
if (i === current) el.classList.add('is-active');
else if (i < current) el.classList.add('is-prev');
else el.classList.add('is-next');
book.appendChild(el);
});
}

function updateNav() {
prevBtn.disabled = current <= 0;
nextBtn.disabled = current >= pages.length - 1;
restartBtn.disabled = current <= 0;
}

/* ============================================================
NAVEGAÇÃO — EFEITO DE PÁGINA VIRANDO
============================================================ */
function cancelDrag() {
if (!dragState) return;
book.classList.remove('grabbing');

[...book.children].forEach(el => {
el.classList.remove('dragging');
if (el.classList.contains('flip-layer')) {
el.classList.remove('flip-layer');
el.classList.add('is-active');
}
el.style.transform = '';
el.style.transformOrigin = '';
el.style.zIndex = '';
});
dragState = null;
}

function waitTransitionEnd(el, fallbackMs, cb) {
let done = false;

const finish = () => {
if (done) return;
done = true;
el.removeEventListener('transitionend', finish);
clearTimeout(timer);
cb();
};

const timer = setTimeout(finish, fallbackMs);
el.addEventListener('transitionend', finish, { once:true });
}

function go(direction) {
if (animating) return;

const target = current + direction;
if (target < 0 || target >= pages.length) return;

const flipping = book.querySelector('.is-active');
const incoming = book.querySelector(direction > 0 ? '.is-next' : '.is-prev');
const other = book.querySelector(direction > 0 ? '.is-prev' : '.is-next');

if (!flipping || !incoming) return;

animating = true;

flipping.classList.remove('is-active');
flipping.classList.add('flip-layer');
book.appendChild(flipping);
flipping.style.transformOrigin = direction > 0 ? 'left center' : 'right center';

incoming.style.zIndex = '2';
if (other) other.style.zIndex = '1';

void flipping.offsetWidth;
flipping.style.transform = `rotateY(${direction > 0 ? -180 : 180}deg)`;

waitTransitionEnd(flipping, 700, () => {
current = target;
mountWindow();
updateNav();
animating = false;
preloadAround();
});
}

prevBtn.addEventListener('click', () => go(-1));
nextBtn.addEventListener('click', () => go(1));

restartBtn.addEventListener('click', () => {
if (animating || current <= 0) return;
animating = true;

current = 0;
mountWindow();
updateNav();
preloadAround();

animating = false;

hint.classList.remove('hide');
setTimeout(() => hint.classList.add('hide'), 2000);
});

document.addEventListener('keydown', e => {
if (e.key === 'ArrowRight') go(1);
if (e.key === 'ArrowLeft')  go(-1);
});

/* ============================================================
DRAG / SWIPE — A PÁGINA VIRA CONFORME O DEDO
============================================================ */
let dragState = null;

function dragStart(x, y, pointerId) {
if (animating) return;

dragState = {
startX: x,
startY: y,
dx: 0,
dy: 0,
dir: 0,
w: book.clientWidth,
pointerId,
active: null,
incoming: null,
other: null,
captured: false
};

book.classList.add('grabbing');
}

function dragMove(x, y) {
if (!dragState) return;

const dx = x - dragState.startX;
const dy = y - dragState.startY;
dragState.dx = dx;
dragState.dy = dy;

if (!dragState.dir && Math.abs(dy) > Math.abs(dx)) {
cancelDrag();
return;
}

if (!dragState.dir) {
if (Math.abs(dx) < 10) return;

const dir = dx < 0 ? 1 : -1;
const target = current + dir;

if (target < 0 || target >= pages.length) {
dragState.dx = 0;
return;
}

dragState.dir = dir;

const active = book.querySelector('.is-active');
const incoming = book.querySelector(dir > 0 ? '.is-next' : '.is-prev');
const other = book.querySelector(dir > 0 ? '.is-prev' : '.is-next');

dragState.active = active || null;
dragState.incoming = incoming || null;
dragState.other = other || null;

if (active) {
active.classList.add('dragging');
active.classList.remove('is-active');
active.classList.add('flip-layer');
book.appendChild(active);
active.style.transformOrigin = dir > 0 ? 'left center' : 'right center';
}

if (incoming) incoming.style.zIndex = '2';
if (other) other.style.zIndex = '1';
}

if (!dragState.dir) return;

const progress = Math.min(
Math.abs(dx) / (dragState.w * 0.9),
1
);

const active = dragState.active;
if (!active) return;

const angle = dragState.dir > 0
? -180 * progress
:  180 * progress;

active.style.transform = `rotateY(${angle}deg)`;
}

function dragEnd() {
book.classList.remove('grabbing');

if (!dragState || dragState.ended) return;
dragState.ended = true;

const { dir, dx, w, active: dragActive, incoming: dragIncoming, other: dragOther } = dragState;
const progress = Math.min(Math.abs(dx) / (w * 0.9), 1);
const commit = dir !== 0 && (progress > 0.28 || Math.abs(dx) > w * 0.22);

const active = dragActive;

if (!dir || !active) {
cancelDrag();
return;
}

if (commit) {
animating = true;

active.classList.remove('dragging');
active.style.transform = `rotateY(${dir > 0 ? -180 : 180}deg)`;

const target = current + dir;

waitTransitionEnd(active, 700, () => {
current = target;
mountWindow();
updateNav();
animating = false;
preloadAround();
dragState = null;
});
} else {
active.classList.remove('dragging', 'flip-layer');
active.classList.add('is-active');
active.style.transform = '';
active.style.transformOrigin = '';
active.style.zIndex = '';

if (dragIncoming) dragIncoming.style.zIndex = '';
if (dragOther) dragOther.style.zIndex = '';

dragState = null;
}
}

/* ============================================================
GESTOS DE TOQUE
============================================================ */
book.addEventListener('pointerdown', e => {
if (e.target.closest('.nav')) return;
dragStart(e.clientX, e.clientY, e.pointerId);
});

book.addEventListener('pointermove', e => {
if (!dragState || e.pointerId !== dragState.pointerId) return;

if (!dragState.captured && Math.abs(e.clientX - dragState.startX) > 10) {
try { book.setPointerCapture(e.pointerId); } catch(_) {}
dragState.captured = true;
}

dragMove(e.clientX, e.clientY);
});

book.addEventListener('pointerup', e => {
if (!dragState || e.pointerId !== dragState.pointerId) return;
try { book.releasePointerCapture(e.pointerId); } catch(_) {}
dragEnd();
});

book.addEventListener('pointercancel', e => {
if (!dragState || e.pointerId !== dragState.pointerId) return;
dragEnd();
});

window.addEventListener('pointerup', e => {
if (!dragState || e.pointerId !== dragState.pointerId) return;
try { book.releasePointerCapture(e.pointerId); } catch(_) {}
dragEnd();
});

/* ============================================================
INIT
============================================================ */
async function init() {
const files = await discoverPhotos();
photos = files;

if (!photos.length) {
loading.innerHTML = 'Nenhuma foto encontrada em <b>/fotos/</b>.<br><small>Confira o arquivo fotos/manifest.json.</small>';
return;
}
pages = buildPages(photos);
loading.style.display = 'none';
current = 0;
mountWindow();
updateNav();
preloadAround();

setTimeout(() => hint.classList.add('hide'), 4000);
}
init();

if ('serviceWorker' in navigator) {
window.addEventListener('load', () => {
// updateViaCache:'none' garante que o próprio sw.js NUNCA venha do
// cache HTTP do navegador — toda checagem de atualização baixa o
// arquivo de verdade, então a mudança no CACHE_VERSION é vista na hora.
navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
.then(reg => {
console.log('SW registrado:', reg.scope);

// Checa por atualização assim que o app volta a ficar visível
// (ex.: usuário reabre o PWA fechado em segundo plano).
document.addEventListener('visibilitychange', () => {
if (document.visibilityState === 'visible') reg.update();
});

// Checagem periódica enquanto o app fica aberto, sem depender de
// uma nova navegação para disparar a verificação.
setInterval(() => reg.update(), 60 * 1000);
})
.catch(err => console.error('Falha no registro do SW:', err));

// Quando o novo SW assume o controle (após skipWaiting + clients.claim),
// recarrega a página uma vez para já exibir a versão nova imediatamente.
let refreshing = false;
navigator.serviceWorker.addEventListener('controllerchange', () => {
if (refreshing) return;
refreshing = true;
window.location.reload();
});
});
}

</script>
