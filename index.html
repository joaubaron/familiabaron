<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5c3a21">
<title>Álbum de Fotos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    background:#3c2c1c;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(120,80,40,0.25), transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(90,60,30,0.25), transparent 55%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0 2px, transparent 2px 6px);
    color:#3a2415;
    user-select:none;
  }

  #stack {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    cursor: grab;
    touch-action: pan-y;
  }
  #stack.grabbing { cursor: grabbing; }

  /* Fotos decorativas espiadas por trás, dando efeito de pilha */
  .deco {
    position:absolute;
    width:min(88vw, 500px);
    height:min(76vh, 740px);
    background:#efe4cc;
    border-radius:3px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.4);
    pointer-events:none;
    z-index:0;
  }
  .deco1 { transform: translate(-14px, 10px) rotate(-6deg); opacity:0.75; }
  .deco2 { transform: translate(16px, 16px) rotate(5deg); opacity:0.55; }

  .card {
    position:absolute;
    width:min(92vw, 520px);
    height:min(80vh, 760px);
    background:#faf6ea;
    border-radius:3px;
    box-shadow:
      0 16px 34px rgba(0,0,0,0.45),
      inset 0 0 0 1px rgba(120,80,40,0.15);
    background-image:
      radial-gradient(circle at 25% 20%, rgba(255,255,255,0.5), transparent 65%);
    overflow:hidden;
    display:flex; flex-direction:column;
    padding:22px 22px 40px;
    z-index:5;
    will-change: transform, opacity;
  }

  /* ---- "Cantoneiras" de álbum antigo nos cantos ---- */
  .card:not(.cover)::before,
  .card:not(.cover)::after {
    content:'';
    position:absolute;
    width:26px; height:26px;
    background: linear-gradient(135deg, rgba(150,110,60,0.55), rgba(150,110,60,0.15));
    pointer-events:none;
    z-index:3;
  }
  .card:not(.cover)::before {
    top:0; left:0;
    clip-path: polygon(0 0, 100% 0, 0 100%);
  }
  .card:not(.cover)::after {
    bottom:0; right:0;
    clip-path: polygon(100% 100%, 0 100%, 100% 0);
  }

  .card-number {
    position:absolute; bottom:12px; left:0; right:0;
    text-align:center; font-size:13px; color:#8a6b4a;
    font-style:italic; letter-spacing:1px;
  }

  /* ---- MOLDURA + FOTO ---- */
  .photo-frame {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
  }

  .photo {
    background: #fff;
    padding: 10px 10px 0;
    border-radius: 2px;
    box-shadow: 0 6px 18px rgba(60, 35, 15, 0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
    max-height: 100%;
    transform: rotate(var(--rot, 0deg));
  }

  .photo img {
    display: block;
    max-width: 100%;
    max-height: 55vh;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: sepia(0.25) contrast(1.05) saturate(0.9);
    background: #111;
    transition: transform 0.3s ease;
    transform-origin: center;
  }
  .photo img.zoomed {
    transform: scale(2.2);
    position: relative;
    z-index: 50;
  }

  .photo .caption {
    font-family: 'Georgia', serif;
    font-style: italic;
    font-size: 13px;
    color: #7a5a3a;
    text-align: center;
    margin: 10px 0 12px;
    max-width: 100%;
    white-space: normal;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    padding: 0 6px;
    line-height: 1.3;
  }

  /* ---- CAPA (preenche tudo) ---- */
  .cover {
    position: relative;
    padding: 0 !important;
    border: none;
    overflow: hidden;
    background: #2a1a0e;
  }

  .cover-img {
    position: absolute;
    inset: 0;
    background-image: url('fotos/capa.webp');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    background-color: #2a1a0e;
    z-index: 1;
  }

  /* ---- CARTÃO FINAL (mesmo estilo das fotos) ---- */
  .end-page {
    padding: 22px 22px 40px;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .end-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    padding: 20px;
  }

  .end-ornament {
    font-size: 44px;
    color: #8a6b4a;
    opacity: 0.75;
    margin-bottom: 22px;
  }

  .end-title {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: clamp(22px, 5vw, 30px);
    font-style: italic;
    font-weight: normal;
    letter-spacing: 2px;
    color: #7a5a3a;
    margin-bottom: 24px;
  }

  .end-line {
    width: 80px;
    height: 1px;
    background: #b89a72;
    opacity: 0.7;
    margin: 0 0 24px 0;
  }

  .end-message {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-style: italic;
    font-size: 16px;
    line-height: 1.9;
    color: #7a5a3a;
    max-width: 300px;
    margin-bottom: 24px;
  }

  .end-count {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-style: italic;
    font-size: 13px;
    color: #8a6b4a;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .end-signature {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-style: italic;
    font-size: 13px;
    color: #8a6b4a;
    letter-spacing: 1px;
    opacity: 0.85;
  }

  /* ---- CONTROLES ---- */
  .nav {
    position:absolute; bottom:0; left:0; right:0;
    display:flex; justify-content:space-between;
    padding:14px 18px;
    z-index:100;
  }
  .nav button {
    background:rgba(245,236,216,0.9);
    border:none; border-radius:50%;
    width:52px; height:52px;
    font-size:22px; color:#5c3a21;
    box-shadow:0 6px 16px rgba(0,0,0,0.4);
    cursor:pointer; transition:transform 0.15s, background 0.2s;
    display:flex; align-items:center; justify-content:center;
  }
  .nav button:active { transform:scale(0.9); background:#e8d9bc; }
  .nav button:disabled { opacity:0.3; }

  .hint {
    position:absolute; top:14px; left:0; right:0;
    text-align:center; color:#d8c0a0; font-size:12px;
    font-style:italic; letter-spacing:1px; z-index:100;
    text-shadow:0 2px 4px rgba(0,0,0,0.6);
    pointer-events:none; transition:opacity 0.6s;
  }
  .hint.hide { opacity:0; }

  #loading {
    position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center;
    color:#e0c8a0; font-style:italic; z-index:200;
    background:#2b1810;
  }

  @media (max-width:480px) {
    .card, .deco { width:94vw; height:78vh; }
    .card { padding:16px 16px 36px; }
    .photo { padding:8px 8px 0; }
    .photo img { max-height: 50vh; }
    .photo .caption { font-size:12px; margin:8px 0 10px; }
    .end-ornament { font-size: 36px; margin-bottom: 18px; }
    .end-message { font-size: 15px; }
    .end-title { font-size: 22px; }
  }
</style>
</head>
<body>

<div id="loading">Abrindo o álbum…</div>

<div id="stack">
  <div class="deco deco1"></div>
  <div class="deco deco2"></div>
</div>

<div class="hint" id="hint">Deslize ou toque nas setas para passar as fotos</div>

<div class="nav">
  <button id="prev" aria-label="Foto anterior">‹</button>
  <button id="next" aria-label="Próxima foto">›</button>
</div>

<script>
const PHOTOS_DIR = 'fotos/';
const MANIFEST_URL = PHOTOS_DIR + 'manifest.json';

const stack = document.getElementById('stack');
const loading = document.getElementById('loading');
const hint = document.getElementById('hint');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

let photos = [];   // [{ file, caption }, ...]
let pages = [];
let current = 0;
let animating = false;

// ---------- Descobrir fotos ----------
async function discoverPhotos() {
  console.log('🔍 Procurando fotos...');

  // 1) fotos/manifest.json
  try {
    const url = MANIFEST_URL + '?t=' + Date.now();
    const r = await fetch(url);
    if (r.ok) {
      const list = await r.json();
      const normalized = normalizeList(list);
      if (normalized.length) return normalized;
    }
  } catch(e) { console.error('Erro manifest:', e); }

  // 2) fotos.json na raiz
  try {
    const r = await fetch('fotos.json?t=' + Date.now());
    if (r.ok) {
      const list = await r.json();
      const normalized = normalizeList(list);
      if (normalized.length) return normalized;
    }
  } catch(e) {}

  // 3) GitHub API (fallback)
  try {
    const host = location.hostname;
    const parts = location.pathname.split('/').filter(Boolean);
    const repo = parts[0];
    if (host.endsWith('github.io') && repo) {
      const user = host.split('.')[0];
      const api = `https://api.github.com/repos/${user}/${repo}/contents/fotos`;
      const r = await fetch(api);
      if (r.ok) {
        const data = await r.json();
        const files = data
          .filter(f => f.type === 'file' && /\.(jpe?g|png|gif|webp|bmp)$/i.test(f.name))
          .map(f => f.name)
          .sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));
        if (files.length) return normalizeList(files);
      }
    }
  } catch(e) { console.error('Erro API:', e); }

  return [];
}

// Aceita ["a.jpg"] ou [{file, caption}] — ignora capa.*
function normalizeList(list) {
  if (!Array.isArray(list)) return [];
  return list.map(item => {
    if (typeof item === 'string') {
      return {
        file: item,
        caption: item.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ')
      };
    }
    return {
      file: item.file,
      caption: item.caption || item.file.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ')
    };
  }).filter(x => x.file && !/^capa\.(jpe?g|png|webp)$/i.test(x.file));
}

function buildPages(fileList) {
  const pgs = [{ type:'cover' }];
  for (let i = 0; i < fileList.length; i++) {
    pgs.push({ type:'photo', items:[fileList[i]] });  // 1 foto por cartão
  }
  if (fileList.length > 0) pgs.push({ type:'end' });
  return pgs;
}

// ---------- Render ----------
function renderPage(page, index) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.index = index;

  // Rotação leve e estável por cartão, como se estivesse jogado numa mesa
  const seedRot = (index * 37) % 9;
  el.style.setProperty('--card-rot', ((seedRot - 4) * 0.6) + 'deg');

  if (page.type === 'cover') {
    el.classList.add('cover');
    el.innerHTML = `<div class="cover-img"></div>`;
  } else if (page.type === 'end') {
    el.classList.add('end-page');
    el.innerHTML = `
      <div class="end-content">
        <div class="end-ornament">❦</div>
        <h1 class="end-title">Continua…</h1>
        <div class="end-line"></div>
        <p class="end-message">
          O tempo passa,<br>
          as fotos ficam,<br>
          e o amor permanece.
        </p>
        <div class="end-line"></div>
        <p class="end-signature">Nossa família</p>
      </div>
    `;
  } else {
    const frame = document.createElement('div');
    frame.className = 'photo-frame';

    page.items.forEach((item) => {
      const wrap = document.createElement('div');
      wrap.className = 'photo';

      const seed = (item.file.length * (index + 1)) % 3;
      wrap.style.setProperty('--rot', (seed - 1) * 0.8 + 'deg');

      const img = document.createElement('img');
      img.src = PHOTOS_DIR + encodeURIComponent(item.file);
      img.alt = item.caption;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onerror = () => {
        img.onerror = null;
        img.style.background = '#e8dcc4';
        img.style.minWidth = '200px';
        img.style.minHeight = '150px';
        img.alt = '📷 foto indisponível';
      };

      const cap = document.createElement('div');
      cap.className = 'caption';
      cap.textContent = item.caption;

      let lastTap = 0;
      img.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTap < 350) {
          img.classList.toggle('zoomed');
        }
        lastTap = now;
      });

      wrap.appendChild(img);
      wrap.appendChild(cap);
      frame.appendChild(wrap);
    });

    el.appendChild(frame);

    const pn = document.createElement('div');
    pn.className = 'card-number';
    pn.textContent = `— ${index} —`;
    el.appendChild(pn);
  }
  return el;
}

const preloadCache = new Set();
function preloadPage(index) {
  const p = pages[index];
  if (!p || p.type !== 'photo') return;
  p.items.forEach(item => {
    if (preloadCache.has(item.file)) return;
    preloadCache.add(item.file);
    const img = new Image();
    img.src = PHOTOS_DIR + encodeURIComponent(item.file);
  });
}

function baseTransform(el) {
  return `rotate(${el.style.getPropertyValue('--card-rot') || '0deg'})`;
}

function showPage(index) {
  stack.querySelectorAll('.card').forEach(c => c.remove());
  const el = renderPage(pages[index], index);
  el.style.transform = baseTransform(el);
  el.style.opacity = 1;
  stack.appendChild(el);
  current = index;
  updateNav();
  preloadPage(index + 1);
  preloadPage(index - 1);
}

function updateNav() {
  prevBtn.disabled = current <= 0;
  nextBtn.disabled = current >= pages.length - 1;
}

// ---------- Navegação: cartão de cima "sai da pilha", o de baixo sobe ----------
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeInOutCubic(x) { return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2; }

// t = 0..1 do gesto/animação. direction: 1 = próxima foto, -1 = anterior.
function applyTurnVisual(outEl, inEl, direction, t) {
  t = Math.min(Math.max(t, 0), 1);

  // Cartão saindo: desliza para o lado, sobe um pouco e gira, some.
  const outX = direction > 0 ? -t * 90 : t * 90;
  const outY = -t * 26;
  const outRotBase = parseFloat(outEl.dataset.rot || '0');
  const outRot = outRotBase + (direction > 0 ? -10 : 10) * t;
  outEl.style.transform = `translate(${outX}px, ${outY}px) rotate(${outRot}deg)`;
  outEl.style.opacity = String(1 - t * 0.95);

  // Cartão entrando: vem de baixo da pilha, cresce e some o esmaecido.
  const inRotBase = parseFloat(inEl.dataset.rot || '0');
  const scale = 0.94 + 0.06 * t;
  const inY = (1 - t) * 20;
  inEl.style.transform = `translate(0, ${inY}px) rotate(${inRotBase}deg) scale(${scale})`;
  inEl.style.opacity = String(0.55 + 0.45 * t);
}

function resetTurnVisual(el) {
  const rot = parseFloat(el.dataset.rot || '0');
  el.style.transform = `rotate(${rot}deg)`;
  el.style.opacity = 1;
}

// Animação programática (botões, teclado)
function turn(direction) {
  if (animating || drag) return;
  const target = current + direction;
  if (target < 0 || target >= pages.length) return;
  animating = true;

  const topEl = stack.querySelector('.card');
  topEl.dataset.rot = (topEl.style.getPropertyValue('--card-rot') || '0deg').replace('deg','');
  topEl.style.zIndex = 5;

  const bottomEl = renderPage(pages[target], target);
  bottomEl.dataset.rot = (bottomEl.style.getPropertyValue('--card-rot') || '0deg').replace('deg','');
  bottomEl.style.zIndex = 1;
  bottomEl.style.opacity = 0.55;
  stack.insertBefore(bottomEl, topEl);

  const dur = 380;
  const startTime = performance.now();
  function step(now) {
    const p = Math.min((now - startTime) / dur, 1);
    applyTurnVisual(topEl, bottomEl, direction, easeInOutCubic(p));
    if (p < 1) {
      requestAnimationFrame(step);
    } else {
      stack.querySelectorAll('.card').forEach(c => c.remove());
      bottomEl.style.zIndex = 5;
      resetTurnVisual(bottomEl);
      stack.appendChild(bottomEl);
      current = target;
      updateNav();
      animating = false;
      preloadPage(current + 1);
      preloadPage(current - 1);
    }
  }
  requestAnimationFrame(step);
}

// Arraste em tempo real (mouse/touch via Pointer Events)
let drag = null;

function dragStart(clientX) {
  if (animating) return;
  drag = { startX: clientX, width: stack.clientWidth, direction: null, t: 0 };
  stack.classList.add('grabbing');
}

function dragMove(clientX) {
  if (!drag) return;
  const dx = clientX - drag.startX;

  if (drag.direction === null) {
    if (Math.abs(dx) < 8) return;
    const dir = dx < 0 ? 1 : -1;
    const target = current + dir;
    if (target < 0 || target >= pages.length) { drag.direction = 0; return; }
    drag.direction = dir;
    drag.target = target;
    drag.topEl = stack.querySelector('.card');
    drag.topEl.dataset.rot = (drag.topEl.style.getPropertyValue('--card-rot') || '0deg').replace('deg','');
    drag.topEl.style.zIndex = 5;
    drag.bottomEl = renderPage(pages[target], target);
    drag.bottomEl.dataset.rot = (drag.bottomEl.style.getPropertyValue('--card-rot') || '0deg').replace('deg','');
    drag.bottomEl.style.zIndex = 1;
    drag.bottomEl.style.opacity = 0.55;
    stack.insertBefore(drag.bottomEl, drag.topEl);
  }
  if (!drag.direction) return;

  drag.t = Math.min(Math.abs(dx) / (drag.width * 0.7), 1);
  applyTurnVisual(drag.topEl, drag.bottomEl, drag.direction, drag.t);
}

function dragEnd() {
  stack.classList.remove('grabbing');
  if (!drag || !drag.direction) { drag = null; return; }

  const { topEl, bottomEl, direction, target, t } = drag;
  const complete = t > 0.32;
  animating = true;
  drag = null;

  const startT = t;
  const endT = complete ? 1 : 0;
  const dur = 220;
  const startTime = performance.now();
  function step(now) {
    const p = Math.min((now - startTime) / dur, 1);
    const eased = startT + (endT - startT) * easeOutCubic(p);
    applyTurnVisual(topEl, bottomEl, direction, eased);
    if (p < 1) {
      requestAnimationFrame(step);
    } else {
      if (complete) {
        stack.querySelectorAll('.card').forEach(c => c.remove());
        bottomEl.style.zIndex = 5;
        resetTurnVisual(bottomEl);
        stack.appendChild(bottomEl);
        current = target;
      } else {
        bottomEl.remove();
        resetTurnVisual(topEl);
      }
      updateNav();
      animating = false;
      preloadPage(current + 1);
      preloadPage(current - 1);
    }
  }
  requestAnimationFrame(step);
}

prevBtn.addEventListener('click', () => turn(-1));
nextBtn.addEventListener('click', () => turn(1));

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') turn(1);
  if (e.key === 'ArrowLeft') turn(-1);
});

stack.addEventListener('pointerdown', e => dragStart(e.clientX));
stack.addEventListener('pointermove', e => dragMove(e.clientX));
window.addEventListener('pointerup', dragEnd);
window.addEventListener('pointercancel', dragEnd);

// ---------- Init ----------
async function init() {
  const files = await discoverPhotos();
  photos = files;

  if (!photos.length) {
    loading.innerHTML = 'Nenhuma foto encontrada em <b>/fotos/</b>.<br><small>Confira o arquivo fotos/manifest.json.</small>';
    return;
  }
  pages = buildPages(photos);
  loading.style.display = 'none';
  showPage(0);

  setTimeout(() => hint.classList.add('hide'), 4000);
}

init();

// ---------- Service Worker ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
