<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5c3a21">
<title>Álbum de Fotos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
height:100%; overflow:hidden;
font-family: 'Georgia', 'Times New Roman', serif;
background:#2b1810;
background-image:
radial-gradient(circle at 20% 20%, rgba(120,80,40,0.3), transparent 60%),
radial-gradient(circle at 80% 80%, rgba(90,60,30,0.3), transparent 60%);
color:#3a2415;
user-select:none;
}

/* ============================================================
PALCO — perspectiva única
============================================================ */
#book {
position:absolute; inset:0;
display:flex; align-items:center; justify-content:center;
cursor: grab;
touch-action: pan-y;
overflow: hidden;
perspective: 2000px;
perspective-origin: 50% 50%;
}
#book.grabbing { cursor: grabbing; }

/* ============================================================
PÁGINA (estática por baixo)
============================================================ */
.page {
position:absolute;
width:min(92vw, 520px);
height:min(80vh, 760px);
background:#f5ecd8;
border-radius:6px;
box-shadow:
0 20px 40px rgba(0,0,0,0.5),
inset 0 0 0 1px rgba(120,80,40,0.2),
inset 0 0 80px rgba(160,120,70,0.25);
background-image:
repeating-linear-gradient(0deg, rgba(160,120,70,0.04) 0 2px, transparent 2px 4px),
radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), transparent 70%);
transform-origin: center center;
backface-visibility:hidden;
overflow:hidden;
display:flex; flex-direction:column;
padding:22px 22px 40px;
}

.page.is-active { opacity:1; z-index: 3; }
.page.is-next,
.page.is-prev { opacity: 0; pointer-events: none; z-index: 1; }

.page::after {
content:''; position:absolute; inset:0;
background:linear-gradient(90deg, rgba(90,60,30,0.18), transparent 8%);
pointer-events:none;
border-radius:6px;
}

.page-number {
position:absolute; bottom:12px; left:0; right:0;
text-align:center; font-size:13px; color:#8a6b4a;
font-style:italic; letter-spacing:1px;
}

/* ============================================================
MOLDURA + FOTO
============================================================ */
.photo-frame {
flex: 1;
display: flex;
justify-content: center;
align-items: center;
padding: 10px;
}
.photo {
background: #fff;
padding: 10px 10px 0;
border-radius: 2px;
box-shadow: 0 6px 18px rgba(60, 35, 15, 0.4);
display: flex; flex-direction: column; align-items: center;
max-width: 100%; max-height: 100%;
transform: rotate(var(--rot, 0deg));
}
.photo img {
display: block;
max-width: 100%;
max-height: 55vh;
width: auto; height: auto;
object-fit: contain;
filter: sepia(0.25) contrast(1.05) saturate(0.9);
background: #111;
-webkit-user-drag: none;
user-drag: none;
}
.photo .caption {
font-family:'Georgia', serif; font-style: italic;
font-size: 13px; color:#7a5a3a; text-align:center;
margin: 10px 0 12px; max-width: 100%;
overflow: hidden;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
padding: 0 6px; line-height: 1.3;
}
.photo .placeholder {
padding: 40px 30px; color:#8a6b4a; font-style: italic;
font-size: 13px; background:#e8dcc4; border-radius: 2px;
}

/* ============================================================
CAPA
============================================================ */
.cover {
position: relative;
padding: 0 !important;
border: none;
overflow: hidden;
background: #2a1a0e;
}
.cover-img {
position: absolute; inset: 0;
background-image: url('fotos/capa.webp');
background-size: cover;
background-repeat: no-repeat;
background-position: center;
background-color: #2a1a0e;
z-index: 1;
}

/* ============================================================
PÁGINA FINAL
============================================================ */
.end-page {
padding: 22px 22px 40px;
justify-content: center; align-items: center; text-align: center;
}
.end-content {
display: flex; flex-direction: column;
align-items: center; justify-content: center;
height: 100%; width: 100%; padding: 20px;
}
.end-ornament { font-size:44px; color:#8a6b4a; opacity:0.75; margin-bottom:22px; }
.end-title {
font-family:'Georgia','Times New Roman',serif;
font-size: clamp(22px, 5vw, 30px);
font-style: italic; font-weight: normal;
letter-spacing: 2px; color:#7a5a3a; margin-bottom: 24px;
}
.end-line { width:80px; height:1px; background:#b89a72; opacity:0.7; margin:0 0 24px 0; }
.end-message {
font-family:'Georgia','Times New Roman',serif;
font-style: italic; font-size:16px; line-height:1.9;
color:#7a5a3a; max-width:300px; margin-bottom:24px;
}
.end-count {
font-family:'Georgia','Times New Roman',serif;
font-style: italic; font-size:13px; color:#8a6b4a;
letter-spacing:1px; margin-bottom:6px;
}
.end-signature {
font-family:'Georgia','Times New Roman',serif;
font-style: italic; font-size:13px; color:#8a6b4a;
letter-spacing:1px; opacity:0.85;
}

/* ============================================================
FOLHA QUE VIRA (frente + verso colados)
============================================================ */
.flip-leaf {
position:absolute;
width:min(92vw, 520px);
height:min(80vh, 760px);
transform-style: preserve-3d;
transform-origin: left center;   /* padrão: vira pra frente */
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
will-change: transform;
z-index: 60;
pointer-events: none;
}

.flip-leaf .leaf-face {
position:absolute; inset:0;
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
overflow: hidden;
border-radius: 6px;
box-shadow:
0 20px 40px rgba(0,0,0,0.5),
inset 0 0 0 1px rgba(120,80,40,0.2),
inset 0 0 80px rgba(160,120,70,0.25);
background:#f5ecd8;
background-image:
repeating-linear-gradient(0deg, rgba(160,120,70,0.04) 0 2px, transparent 2px 4px),
radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), transparent 70%);
display:flex; flex-direction:column;
padding:22px 22px 40px;
}

/* verso: já começa rotacionado 180° pra aparecer depois dos 90° */
.flip-leaf .leaf-face.back {
transform: rotateY(180deg);
background:#efe3cc;
background-image:
linear-gradient(270deg, rgba(90,60,30,0.22), transparent 30%),
repeating-linear-gradient(0deg, rgba(160,120,70,0.05) 0 2px, transparent 2px 4px);
}

/* sombra dinâmica — só opacity muda */
.flip-leaf .leaf-shade {
position:absolute; inset:0;
pointer-events:none;
will-change: opacity;
opacity: 0;
background: linear-gradient(90deg, rgba(30,15,5,0.55), rgba(30,15,5,0) 55%);
border-radius: 6px;
}
.flip-leaf.dir-back .leaf-shade {
background: linear-gradient(270deg, rgba(30,15,5,0.55), rgba(30,15,5,0) 55%);
}

/* ============================================================
ZOOM OVERLAY
============================================================ */
#zoom-overlay {
position: fixed; inset: 0;
background: rgba(20, 10, 5, 0.92);
display: flex; align-items: center; justify-content: center;
z-index: 500; padding: 20px;
cursor: zoom-out;
opacity: 0; visibility: hidden;
transition: opacity 0.25s ease, visibility 0s linear 0.25s;
outline: none;
}
#zoom-overlay.visible {
opacity: 1; visibility: visible;
transition: opacity 0.25s ease, visibility 0s;
}
#zoom-overlay img {
max-width: 95vw; max-height: 95vh; object-fit: contain;
box-shadow: 0 10px 40px rgba(0,0,0,0.8);
filter: sepia(0.25) contrast(1.05) saturate(0.9);
-webkit-user-drag: none; user-drag: none;
}

/* ============================================================
CONTROLES
============================================================ */
.nav {
position:absolute; bottom:0; left:0; right:0;
display:flex; justify-content:space-between;
padding:14px 18px; z-index:100;
}
.nav button {
background:rgba(245,236,216,0.9);
border:none; border-radius:50%;
width:52px; height:52px;
font-size:22px; color:#5c3a21;
box-shadow:0 6px 16px rgba(0,0,0,0.4);
cursor:pointer; transition:transform 0.15s, background 0.2s;
display:flex; align-items:center; justify-content:center;
}
.nav button:active { transform:scale(0.9); background:#e8d9bc; }
.nav button:disabled { opacity:0.3; }

.hint {
position:absolute; top:14px; left:0; right:0;
text-align:center; color:#d8c0a0; font-size:12px;
font-style:italic; letter-spacing:1px; z-index:100;
text-shadow:0 2px 4px rgba(0,0,0,0.6);
pointer-events:none; transition:opacity 0.6s;
}
.hint.hide { opacity:0; }

#loading {
position:absolute; inset:0; display:flex;
align-items:center; justify-content:center;
color:#e0c8a0; font-style:italic; z-index:200;
background:#2b1810;
}

@media (max-width:480px) {
.page, .flip-leaf { width:94vw; height:78vh; }
.page, .flip-leaf .leaf-face { padding:16px 16px 36px; }
.photo { padding:8px 8px 0; }
.photo img { max-height: 50vh; }
.photo .caption { font-size:12px; margin:8px 0 10px; }
.end-ornament { font-size: 36px; margin-bottom: 18px; }
.end-message { font-size: 15px; }
.end-title { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
#zoom-overlay { transition-duration: 1ms !important; }
}
</style>
</head>
<body>

<div id="loading">Abrindo o álbum…</div>

<div id="book"></div>

<div class="hint" id="hint">Deslize ou toque nas setas para folhear</div>

<div class="nav">
<button id="prev" aria-label="Página anterior">‹</button>
<button id="next" aria-label="Próxima página">›</button>
</div>

<div id="zoom-overlay" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1">
<img alt="">
</div>

<script>
const PHOTOS_DIR = 'fotos/';
const MANIFEST_URL = PHOTOS_DIR + 'manifest.json';
const HINT_KEY = 'album_hint_seen_v1';
const DURATION = 650;

const book = document.getElementById('book');
const loading = document.getElementById('loading');
const hint = document.getElementById('hint');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const zoomOverlay = document.getElementById('zoom-overlay');
const zoomImg = zoomOverlay.querySelector('img');

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let photos = [];
let pages = [];
let current = 0;
let animating = false;

/* ============================================================
ZOOM
============================================================ */
function openZoom(src, alt) {
if (zoomOverlay.classList.contains('visible')) return;
zoomImg.src = src;
zoomImg.alt = alt || '';
zoomOverlay.classList.add('visible');
zoomOverlay.setAttribute('aria-hidden', 'false');
zoomOverlay.focus();
}
function closeZoom() {
if (!zoomOverlay.classList.contains('visible')) return;
zoomOverlay.classList.remove('visible');
zoomOverlay.setAttribute('aria-hidden', 'true');
zoomImg.src = '';
}
zoomOverlay.addEventListener('click', closeZoom);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeZoom(); });

/* ============================================================
DESCOBERTA
============================================================ */
async function discoverPhotos() {
try {
const r = await fetch(MANIFEST_URL + '?t=' + Date.now());
if (r.ok) { const n = normalizeList(await r.json()); if (n.length) return n; }
} catch(e) { console.error('manifest:', e); }
try {
const r = await fetch('fotos.json?t=' + Date.now());
if (r.ok) { const n = normalizeList(await r.json()); if (n.length) return n; }
} catch(e) {}
try {
const host = location.hostname;
const repo = location.pathname.split('/').filter(Boolean)[0];
if (host.endsWith('github.io') && repo) {
const user = host.split('.')[0];
const api = `https://api.github.com/repos/${user}/${repo}/contents/fotos`;
const r = await fetch(api);
if (r.ok) {
const data = await r.json();
const files = data
.filter(f => f.type === 'file' && /\.(jpe?g|png|gif|webp|bmp)$/i.test(f.name))
.map(f => f.name)
.sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));
if (files.length) return normalizeList(files);
}
}
} catch(e) { console.error('api:', e); }
return [];
}

function normalizeList(list) {
if (!Array.isArray(list)) return [];
const seen = new Set(); const out = [];
for (const item of list) {
let file, caption;
if (typeof item === 'string') {
file = item;
caption = item.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
} else if (item && item.file) {
file = item.file;
caption = item.caption || item.file.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
} else continue;
if (/^capa\.(jpe?g|png|webp|gif|bmp)$/i.test(file)) continue;
if (seen.has(file)) continue;
seen.add(file);
out.push({ file, caption });
}
return out;
}

function buildPages(fileList) {
const pgs = [{ type:'cover' }];
for (let i = 0; i < fileList.length; i++) pgs.push({ type:'photo', items:[fileList[i]] });
if (fileList.length > 0) pgs.push({ type:'end' });
return pgs;
}

/* ============================================================
RENDER
============================================================ */
function pageInnerHTML(page, index) {
if (page.type === 'cover') {
return `<div class="cover-img"></div>`;
}
if (page.type === 'end') {
return `
<div class="end-content">
<div class="end-ornament">❦</div>
<h1 class="end-title">Continua…</h1>
<div class="end-line"></div>
<p class="end-message">
O tempo passa,<br>
as fotos ficam,<br>
e o amor permanece.
</p>
<div class="end-line"></div>
<p class="end-count">${photos.length} ${photos.length === 1 ? 'fotografia' : 'fotografias'}</p>
<p class="end-signature">Nossa família</p>
</div>
`;
}
// photo
let html = `<div class="photo-frame">`;
const item = page.items[0];
const seed = (item.file.length * (index + 1)) % 3;
html += `<div class="photo" style="--rot:${(seed - 1) * 0.8}deg">
<img src="${PHOTOS_DIR + encodeURIComponent(item.file)}" alt="${item.caption.replace(/"/g,'&quot;')}" loading="lazy" decoding="async" draggable="false">
<div class="caption">${item.caption.replace(/</g,'&lt;')}</div>
</div>`;
html += `</div>`;
html += `<div class="page-number">— ${index} —</div>`;
return html;
}

function renderPage(page, index) {
const el = document.createElement('div');
el.className = 'page';
el.dataset.index = index;
if (page.type === 'cover') el.classList.add('cover');
if (page.type === 'end') el.classList.add('end-page');
el.innerHTML = pageInnerHTML(page, index);

// bind zoom nas imagens
el.querySelectorAll('img').forEach(img => {
img.onerror = () => {
img.onerror = null;
img.style.display = 'none';
const ph = document.createElement('div');
ph.className = 'placeholder';
ph.textContent = '📷 foto indisponível';
img.parentNode.insertBefore(ph, img);
};
let downX = 0, downY = 0, lastTap = 0;
img.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
img.addEventListener('pointerup', e => {
if (Math.hypot(e.clientX - downX, e.clientY - downY) > 10) return;
const now = Date.now();
if (now - lastTap < 350) openZoom(img.src, img.alt);
lastTap = now;
});
});
return el;
}

/* ============================================================
PRELOAD
============================================================ */
const preloadCache = new Set();
function preloadPage(index) {
const p = pages[index];
if (!p || p.type !== 'photo') return;
p.items.forEach(item => {
if (preloadCache.has(item.file)) return;
preloadCache.add(item.file);
const img = new Image();
img.src = PHOTOS_DIR + encodeURIComponent(item.file);
});
}
function preloadAround() {
preloadPage(current + 1);
preloadPage(current + 2);
preloadPage(current - 1);
}

/* ============================================================
JANELA
============================================================ */
function mountWindow() {
book.innerHTML = '';
[current - 1, current, current + 1].forEach(i => {
if (i < 0 || i >= pages.length) return;
const el = renderPage(pages[i], i);
if (i === current) el.classList.add('is-active');
else if (i < current) el.classList.add('is-prev');
else el.classList.add('is-next');
book.appendChild(el);
});
}

function refreshWindow() {
[...book.children].forEach(el => {
if (el.classList.contains('flip-leaf')) return;
const i = +el.dataset.index;
if (i < current - 1 || i > current + 1) el.remove();
});
[current - 1, current, current + 1].forEach(i => {
if (i < 0 || i >= pages.length) return;
if (!book.querySelector(`.page[data-index="${i}"]`)) {
book.appendChild(renderPage(pages[i], i));
}
});
[...book.children].forEach(el => {
if (el.classList.contains('flip-leaf')) return;
const i = +el.dataset.index;
el.classList.toggle('is-active', i === current);
el.classList.toggle('is-prev',   i <  current);
el.classList.toggle('is-next',   i >  current);
});
}

function updateNav() {
prevBtn.disabled = current <= 0;
nextBtn.disabled = current >= pages.length - 1;
}

/* ============================================================
FOLHA QUE VIRA — uma folha, duas faces
============================================================
FRENTE (direction = 1):
- folha começa em 0°, gira até -180° sobre o eixo ESQUERDO.
- face FRONT = página atual (some ao passar de 90°).
- face BACK  = próxima página, pré-rotacionada em 180°, aparece
  naturalmente após 90°.

TRÁS (direction = -1):
- folha começa em 0°, gira até +180° sobre o eixo DIREITO.
- face FRONT = página atual (some ao passar de 90°).
- face BACK  = página anterior, pré-rotacionada, aparece após 90°.
============================================================ */
let flipLeaf = null;

function buildFlipLeaf(underPage, overPage, direction) {
// underPage = página que fica "por baixo" (o resultado)
// overPage  = página que está sendo virada (a atual)
const leaf = document.createElement('div');
leaf.className = 'flip-leaf';
if (direction < 0) leaf.classList.add('dir-back');

// origem do giro
if (direction > 0) {
leaf.style.transformOrigin = 'left center';
leaf.style.left = '50%';   // metade direita do palco (onde a página está)
leaf.style.marginLeft = 'calc(-1 * min(46vw, 260px))'; // desloca pra cobrir a página
} else {
leaf.style.transformOrigin = 'right center';
leaf.style.right = '50%';
leaf.style.marginRight = 'calc(-1 * min(46vw, 260px))';
}
// Nota: o leaf ocupa exatamente o tamanho da .page; centralizamos via left/right.
leaf.style.left = '50%';
leaf.style.transform = 'translate3d(-50%, 0, 0) rotateY(0deg)';

const front = document.createElement('div');
front.className = 'leaf-face front';
front.innerHTML = overPage.innerHTML;

const back = document.createElement('div');
back.className = 'leaf-face back';
back.innerHTML = underPage.innerHTML;

const shade = document.createElement('div');
shade.className = 'leaf-shade';
shade.style.opacity = '0';

leaf.appendChild(front);
leaf.appendChild(back);
leaf.appendChild(shade);

// rebind zoom nas imagens clonadas
leaf.querySelectorAll('img').forEach(img => {
let downX = 0, downY = 0, lastTap = 0;
img.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
img.addEventListener('pointerup', e => {
if (Math.hypot(e.clientX - downX, e.clientY - downY) > 10) return;
const now = Date.now();
if (now - lastTap < 350) openZoom(img.src, img.alt);
lastTap = now;
});
});

book.appendChild(leaf);
return { leaf, shade };
}

function setLeafProgress(progress, direction) {
if (!flipLeaf) return;
const { leaf, shade } = flipLeaf;
const angle = (direction > 0 ? -1 : 1) * 180 * progress;
leaf.style.transform = `translate3d(-50%, 0, 0) rotateY(${angle}deg)`;
// sombra: 0 → 0.85 no meio → 0
shade.style.opacity = String(Math.sin(progress * Math.PI) * 0.85);
}

function destroyLeaf() {
if (flipLeaf && flipLeaf.leaf) flipLeaf.leaf.remove();
flipLeaf = null;
}

/* ============================================================
NAVEGAÇÃO
============================================================ */
function cancelDrag() {
if (!dragState) return;
book.classList.remove('grabbing');
destroyLeaf();
const active = book.querySelector('.page.is-active');
if (active) active.style.opacity = '';
dragState = null;
}

function go(direction) {
if (animating) return;
cancelDrag();
const target = current + direction;
if (target < 0 || target >= pages.length) return;

const fromEl = book.querySelector(`.page[data-index="${current}"]`);
if (!fromEl) return;

// garante que a próxima já está montada por baixo
refreshWindow();
const toEl = book.querySelector(`.page[data-index="${target}"]`);
if (!toEl) return;

// esconde a página de baixo (vai aparecer conforme a folha levanta)
toEl.style.opacity = '0';
toEl.classList.remove('is-prev','is-next');
toEl.classList.add('is-active');
fromEl.classList.remove('is-active');
fromEl.style.opacity = '0';

flipLeaf = buildFlipLeaf(toEl, fromEl, direction);
setLeafProgress(0, direction);

animating = true;

requestAnimationFrame(() => {
requestAnimationFrame(() => {
const dur = reduceMotion ? 1 : DURATION;
const ease = 'cubic-bezier(0.45, 0.05, 0.55, 0.95)';
flipLeaf.leaf.style.transition = `transform ${dur}ms ${ease}`;
flipLeaf.shade.style.transition = `opacity ${dur}ms ${ease}`;

setLeafProgress(1, direction);

const done = () => {
current = target;
destroyLeaf();
[...book.children].forEach(el => {
if (el.classList.contains('page')) el.style.opacity = '';
});
refreshWindow();
updateNav();
animating = false;
preloadAround();
};
const timer = setTimeout(done, dur + 40);
flipLeaf.leaf.addEventListener('transitionend', () => {
clearTimeout(timer);
if (animating) done();
}, { once: true });
});
});
}

prevBtn.addEventListener('click', () => go(-1));
nextBtn.addEventListener('click', () => go(1));

document.addEventListener('keydown', e => {
if (e.key === 'ArrowRight') go(1);
if (e.key === 'ArrowLeft')  go(-1);
});

/* ============================================================
DRAG
============================================================ */
let dragState = null;

function dragStart(x, pointerId) {
if (animating) return;
dragState = { startX: x, dx: 0, dir: 0, w: book.clientWidth, pointerId, started: false };
book.classList.add('grabbing');
}

function dragMove(x) {
if (!dragState) return;
const dx = x - dragState.startX;
dragState.dx = dx;

if (!dragState.started) {
if (Math.abs(dx) < 10) return;
const dir = dx < 0 ? 1 : -1;
const target = current + dir;
if (target < 0 || target >= pages.length) return;
dragState.dir = dir;
dragState.started = true;

const fromEl = book.querySelector(`.page[data-index="${current}"]`);
refreshWindow();
const toEl = book.querySelector(`.page[data-index="${target}"]`);
if (!fromEl || !toEl) { dragState.started = false; return; }

toEl.style.opacity = '0';
toEl.classList.remove('is-prev','is-next');
toEl.classList.add('is-active');
fromEl.classList.remove('is-active');
fromEl.style.opacity = '0';

flipLeaf = buildFlipLeaf(toEl, fromEl, dir);
setLeafProgress(0, dir);
}
if (!dragState.started) return;

const progress = Math.min(Math.abs(dx) / (dragState.w * 0.9), 1);
setLeafProgress(progress, dragState.dir);
}

function dragEnd() {
book.classList.remove('grabbing');
if (!dragState) return;

const { dir, dx, w, started } = dragState;
if (!started) { dragState = null; return; }

const progress = Math.min(Math.abs(dx) / (w * 0.9), 1);
const commit = progress > 0.3 || Math.abs(dx) > w * 0.25;
const direction = dir;

const dur = reduceMotion ? 1 : (commit ? 420 : 300);
const ease = 'cubic-bezier(0.22, 0.61, 0.36, 1)';
flipLeaf.leaf.style.transition = `transform ${dur}ms ${ease}`;
flipLeaf.shade.style.transition = `opacity ${dur}ms ${ease}`;

if (commit) {
animating = true;
setLeafProgress(1, direction);
const done = () => {
current = current + direction;
destroyLeaf();
[...book.children].forEach(el => {
if (el.classList.contains('page')) el.style.opacity = '';
});
refreshWindow();
updateNav();
animating = false;
preloadAround();
};
const timer = setTimeout(done, dur + 40);
flipLeaf.leaf.addEventListener('transitionend', () => {
clearTimeout(timer);
if (animating) done();
}, { once: true });
} else {
setLeafProgress(0, direction);
const timer = setTimeout(() => {
destroyLeaf();
[...book.children].forEach(el => {
if (el.classList.contains('page')) el.style.opacity = '';
});
refreshWindow();
}, dur + 40);
}
dragState = null;
}

book.addEventListener('pointerdown', e => {
if (e.target.closest('.nav')) return;
if (dragState) return;
try { book.setPointerCapture(e.pointerId); } catch(_) {}
dragStart(e.clientX, e.pointerId);
});
book.addEventListener('pointermove', e => {
if (!dragState || e.pointerId !== dragState.pointerId) return;
dragMove(e.clientX);
});
book.addEventListener('pointerup', e => {
if (!dragState || e.pointerId !== dragState.pointerId) return;
try { book.releasePointerCapture(e.pointerId); } catch(_) {}
dragEnd();
});
book.addEventListener('pointercancel', e => {
if (!dragState || e.pointerId !== dragState.pointerId) return;
dragEnd();
});

/* ============================================================
INIT
============================================================ */
async function init() {
const files = await discoverPhotos();
photos = files;

if (!photos.length) {
loading.innerHTML = 'Nenhuma foto encontrada em <b>/fotos/</b>.<br><small>Confira o arquivo fotos/manifest.json.</small>';
return;
}
pages = buildPages(photos);
loading.style.display = 'none';
current = 0;
mountWindow();
updateNav();
preloadAround();

let seen = false;
try { seen = localStorage.getItem(HINT_KEY) === '1'; } catch(_) {}
if (seen) {
hint.classList.add('hide');
} else {
setTimeout(() => {
hint.classList.add('hide');
try { localStorage.setItem(HINT_KEY, '1'); } catch(_) {}
}, 4000);
}
}
init();
</script>
